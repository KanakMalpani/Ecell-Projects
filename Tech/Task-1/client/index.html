<!doctype html>
<!--
  GNN Logistics Inc. — Landing Page (Tech Task-1)

  This is the single HTML file for the entire React app.
  React mounts into <div id="root"> via main.jsx.

  To run locally:
    cd client && npm install && npm run dev
    Open http://localhost:5173
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport meta makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GNN Logistics Inc. - Reliable freight, warehousing, and supply chain solutions across India."
    />
    <title>GNN Logistics Inc. | Global Freight & Supply Chain</title>
  </head>
  <body>
    <!-- React will render the entire app inside this div -->
    <div id="root"></div>
    <!-- Vite loads our React entry point as an ES module -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
